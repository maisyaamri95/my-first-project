<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Belajar Bahasa Inggeris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a student's marked-up exercise book — biro-blue ink, highlighter strokes on key words, one narrow reading column */
:root {
  --bg: #F4F5FB;
  --surface: #FFFFFF;
  --ink: #1B2140;
  --muted: #5A6283;
  --line: #DDE1EE;
  --accent: #2E44C9;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7EBFC;
  --hl: #FFE45C;
  --hl-soft: rgba(255, 220, 60, .55);
  --good: #1D7F53;
  --good-soft: #E1F4EA;
  --bad: #B83434;
  --bad-soft: #FBE6E6;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10132A; --surface: #181C38; --ink: #E8EAF6; --muted: #9DA4C7; --line: #2C3260;
    --accent: #8C9CFF; --accent-ink: #10132A; --accent-soft: #232A5A;
    --hl: #F2D43D; --hl-soft: rgba(242, 212, 61, .30);
    --good: #4CC38A; --good-soft: #15352A; --bad: #F07A7A; --bad-soft: #3A1C24;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10132A; --surface: #181C38; --ink: #E8EAF6; --muted: #9DA4C7; --line: #2C3260;
  --accent: #8C9CFF; --accent-ink: #10132A; --accent-soft: #232A5A;
  --hl: #F2D43D; --hl-soft: rgba(242, 212, 61, .30);
  --good: #4CC38A; --good-soft: #15352A; --bad: #F07A7A; --bad-soft: #3A1C24;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* top bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand {
  font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: -.01em;
  text-decoration: none; color: var(--ink); display: flex; align-items: baseline; gap: 6px;
}
.brand b { background: linear-gradient(transparent 55%, var(--hl-soft) 55%); font-weight: 800; }
.bar .meter { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { width: 72px; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .4s ease; }

main { padding-block: 24px 120px; }

/* home */
.hero { display: grid; gap: 14px; padding-block: 12px 8px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.hero h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 8vw, 54px);
  line-height: 1.02; letter-spacing: -.025em; margin: 0; text-wrap: balance;
}
.hero h1 mark { background: linear-gradient(transparent 52%, var(--hl-soft) 52%); color: inherit; padding: 0 .05em; }
.hero p { margin: 0; color: var(--muted); max-width: 52ch; }
.say-card {
  display: flex; align-items: center; gap: 12px; margin-top: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px;
}
.say-card .en { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.say-card .ms { color: var(--muted); font-size: 15px; }
.say-card > div { flex: 1; min-width: 0; }

.cta-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 6px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-weight: 700;
  padding: 12px 18px; border-radius: 999px; text-decoration: none; font-size: 16px;
}
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn.done { background: var(--good); color: var(--accent-ink); }
.btn:active { transform: translateY(1px); }

.section-h { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 36px 0 12px; letter-spacing: -.01em; }

.lessons { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.lessons a {
  display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px 16px; text-decoration: none; color: var(--ink);
  transition: border-color .15s, transform .15s;
}
.lessons a:hover { border-color: var(--accent); }
.lessons .num {
  font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; color: var(--accent);
  font-variant-numeric: tabular-nums; text-align: center;
}
.lessons .t { font-weight: 700; font-size: 17px; line-height: 1.3; }
.lessons .s { color: var(--muted); font-size: 14px; line-height: 1.4; margin-top: 2px; }
.lessons .txt { min-width: 0; }
.chip {
  font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 999px; white-space: nowrap;
  background: var(--accent-soft); color: var(--accent);
}
.chip.ok { background: var(--good-soft); color: var(--good); }
.lessons a.test { border-style: dashed; border-width: 1.5px; }
.lessons a.test .num { font-size: 26px; }

.tips { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.tips li { padding-left: 26px; position: relative; color: var(--ink); }
.tips li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 12px; height: 6px; border-radius: 3px; background: var(--hl); }

/* lesson */
.crumbs { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
.crumbs a { text-decoration: none; font-weight: 700; }
.lesson-head { margin: 14px 0 6px; }
.lesson-head .eyebrow { color: var(--accent); }
.lesson-head h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 7vw, 44px);
  line-height: 1.05; letter-spacing: -.02em; margin: 4px 0 0; text-wrap: balance;
}
.lesson-head .sub { color: var(--muted); margin: 6px 0 0; }
.hint {
  display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted);
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 10px 0; margin: 16px 0 4px;
}
.hint svg { flex: none; margin-top: 2px; color: var(--accent); }

.lesson { min-width: 0; }
.lesson h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -.01em; margin: 34px 0 10px; line-height: 1.2; text-wrap: balance; }
.lesson h3 { font-family: var(--font-display); font-weight: 700; font-size: 19px; margin: 22px 0 8px; }
.lesson p { margin: 10px 0; }
.lesson ul, .lesson ol { padding-left: 1.3em; margin: 10px 0; }
.lesson li { margin: 4px 0; }
.lesson strong { font-weight: 700; background: linear-gradient(transparent 60%, var(--hl-soft) 60%); }
.lesson td strong, .lesson th strong { background: none; }
.lesson em { color: var(--muted); }
.lesson del { color: var(--bad); }
.lesson hr { display: none; }
.goal {
  font-size: 18px; background: var(--accent-soft); border-radius: var(--r); padding: 12px 16px; margin: 16px 0 !important;
}
.goal strong { background: none; }
.lesson blockquote {
  margin: 16px 0; padding: 4px 16px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line);
}
.lesson blockquote p { margin: 10px 0; }
.lesson code { font-family: var(--font-mono); font-size: .9em; background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; }
.lesson pre {
  overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px 16px; font-size: 15px; line-height: 1.55; margin: 14px 0;
}
.lesson pre code { background: none; padding: 0; }
.tbl { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.lesson table { border-collapse: collapse; width: 100%; font-size: 15.5px; }
.lesson th, .lesson td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.lesson th { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; background: var(--bg); white-space: nowrap; }
.lesson tr:last-child td { border-bottom: 0; }
.lesson thead:has(th:empty) { display: none; }

.tap { cursor: pointer; border-radius: 6px; }
.tap:hover { background: var(--accent-soft); }
td.letter { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--accent); }

.spk {
  flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer; padding: 0;
  vertical-align: middle;
}
.spk:hover { border-color: var(--accent); }
.spk.sm { width: 28px; height: 28px; margin-left: 6px; }
.spk.playing { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.dialog { display: grid; gap: 0; margin: 14px 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.dl { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.dl:last-child { border-bottom: 0; }
.dl .body { flex: 1; min-width: 0; }
.dl .who {
  display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent);
  background: none; font-weight: 700;
}
.dl .body em { display: block; font-size: 15px; }
.dl.gap { justify-content: center; color: var(--muted); padding: 4px; }

.lesson details {
  margin: 14px 0; border: 1.5px dashed var(--accent); border-radius: var(--r); padding: 0 16px; background: var(--surface);
}
.lesson details[open] { padding-bottom: 8px; border-style: solid; }
.lesson summary { cursor: pointer; font-weight: 700; color: var(--accent); padding: 12px 0; list-style: none; }
.lesson summary::-webkit-details-marker { display: none; }

.lesson-foot { display: grid; gap: 14px; margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pager a { text-decoration: none; font-weight: 700; font-size: 15px; display: grid; gap: 2px; max-width: 48%; }
.pager a span { color: var(--muted); font-weight: 400; font-size: 13px; }
.pager a.next { text-align: right; margin-left: auto; }

/* test */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.q.right { border-color: var(--good); }
.q.wrong { border-color: var(--bad); }
.qs { display: grid; gap: 10px; }
.q .qt { display: flex; gap: 10px; align-items: baseline; }
.q .qn { font-family: var(--font-display); font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 1.6em; }
.q .qt > div { min-width: 0; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; padding-left: calc(1.6em + 10px); }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt span {
  display: inline-block; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line);
  cursor: pointer; background: var(--bg); font-size: 16px;
}
.opt input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.q input[type="text"] {
  width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
}
.q input[type="text"]:focus { border-color: var(--accent); outline: none; }
.q .fieldwrap { padding-left: calc(1.6em + 10px); }
.wrongtxt { text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 2px; }
.fb { font-size: 15px; padding-left: calc(1.6em + 10px); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fb .tag { font-weight: 700; }
.q.right .fb .tag { color: var(--good); }
.q.wrong .fb .tag { color: var(--bad); }
.fb button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; color: var(--muted); }
.part-h { font-family: var(--font-display); font-weight: 700; font-size: 20px; margin: 28px 0 10px; }
.part-h small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 14px; color: var(--muted); }

.result {
  margin-top: 24px; background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r);
  padding: 18px; display: grid; gap: 6px; text-align: center;
}
.result .score { font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.result .score small { font-size: 24px; color: var(--muted); }
.result .band { font-weight: 700; font-size: 19px; }
.result p { margin: 0; color: var(--muted); }
.next-topics { display: grid; gap: 6px; margin-top: 8px; text-align: left; }

/* selection speaker */
.selbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: center; pointer-events: none;
}
.selbar button {
  pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: 100%;
  background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 12px 18px;
  font-weight: 700; box-shadow: 0 6px 24px rgba(10, 14, 40, .25); cursor: pointer;
}
.selbar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; opacity: .8; max-width: 52vw; }

@media (max-width: 480px) {
  body { font-size: 16.5px; }
  .lessons a { grid-template-columns: 40px 1fr; padding: 12px 14px; }
  .lessons .num { font-size: 28px; }
  .lessons .chip { grid-column: 2; justify-self: start; }
  .opts, .fb, .q .fieldwrap { padding-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="#" id="brand">Belajar <b>English</b></a>
    <div class="meter" aria-label="Kemajuan">
      <span id="meterTxt">0/8</span>
      <span class="track"><i id="meterBar" style="width:0%"></i></span>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="selbar" id="selbar" hidden>
  <button type="button" id="selBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>Dengar <span id="selTxt"></span></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const LESSONS = ["# Pelajaran 1: Abjad & Sebutan (The Alphabet)\n\n🎯 **Matlamat:** Kenal 26 huruf dan tahu cara sebutnya.\n\n## 1. Abjad Bahasa Inggeris\n\nHuruf sama macam Bahasa Melayu, tapi **cara sebut lain**. Sebutan di bawah ditulis ikut bunyi Melayu.\n\n| Huruf | Sebut | Huruf | Sebut |\n|-------|-------|-------|-------|\n| A a | \"ei\" | N n | \"en\" |\n| B b | \"bi\" | O o | \"ou\" |\n| C c | \"si\" | P p | \"pi\" |\n| D d | \"di\" | Q q | \"kiu\" |\n| E e | \"i\" | R r | \"ar\" |\n| F f | \"ef\" | S s | \"es\" |\n| G g | \"ji\" | T t | \"ti\" |\n| H h | \"eic\" | U u | \"yu\" |\n| I i | \"ai\" | V v | \"vi\" |\n| J j | \"jei\" | W w | \"dabel-yu\" |\n| K k | \"kei\" | X x | \"eks\" |\n| L l | \"el\" | Y y | \"wai\" |\n| M m | \"em\" | Z z | \"zed\" (British) / \"zi\" (American) |\n\n> 💡 **Kenapa penting?** Bila orang tanya *\"How do you spell your name?\"* (Macam mana eja nama awak?), anda perlu sebut huruf satu-satu.\n>\n> Contoh: **AMIN** → \"ei – em – ai – en\"\n\n## 2. Bunyi Yang Selalu Silap\n\nDalam Bahasa Melayu, kita sebut ikut ejaan. Dalam Bahasa Inggeris, **ejaan dan bunyi selalunya tak sama**.\n\n| Ejaan | Bunyi | Contoh | Sebut |\n|-------|-------|--------|-------|\n| **th** | lidah di celah gigi | **th**ank you, **th**ree | \"thenk yu\", \"thri\" |\n| **sh** | macam \"sy\" | **sh**e, **sh**op | \"syi\", \"syop\" |\n| **ch** | macam \"c\" | **ch**air, **ch**icken | \"cer\", \"cikin\" |\n| **ph** | macam \"f\" | **ph**one | \"foun\" |\n| **ee** | \"i\" panjang | m**ee**t, s**ee** | \"miit\", \"sii\" |\n| **oo** | \"u\" panjang | f**oo**d, sch**oo**l | \"fuud\", \"skuul\" |\n| **-tion** | \"syen\" | sta**tion** | \"stei-syen\" |\n\n## 3. Huruf Senyap (Silent Letters) 🤫\n\nAda huruf yang **ditulis tapi tak disebut**:\n\n- **k**nife → \"naif\" (pisau)\n- **k**now → \"nou\" (tahu)\n- w**r**ite → \"rait\" (tulis) — huruf **w** senyap\n- hou**r** → \"awer\" (jam) — huruf **h** senyap\n- lis**t**en → \"lisen\" (dengar) — huruf **t** senyap\n\n## ✏️ Latihan\n\n1. Eja nama anda sendiri huruf demi huruf dengan kuat.\n2. Sebut perkataan ini: **three, shop, phone, school, knife**\n3. Huruf apa yang senyap dalam perkataan **\"write\"**?\n4. Bagaimana sebut huruf **\"H\"** dan **\"W\"**?\n\n<details>\n<summary>👉 Klik untuk lihat jawapan<\/summary>\n\n1. (Ikut nama anda)\n2. \"thri\", \"syop\", \"foun\", \"skuul\", \"naif\"\n3. Huruf **w**\n4. H = \"eic\", W = \"dabel-yu\"\n<\/details>\n\n---\n➡️ Seterusnya: [Pelajaran 2 – Salam & Perkenalan Diri](02-salam-dan-perkenalan.md)\n", "# Pelajaran 2: Salam & Perkenalan Diri (Greetings)\n\n🎯 **Matlamat:** Boleh memberi salam dan memperkenalkan diri.\n\n## 1. Memberi Salam\n\n| Bahasa Inggeris | Maksud | Bila guna |\n|-----------------|--------|-----------|\n| **Hello / Hi** | Helo / Hai | Bila-bila masa |\n| **Good morning** | Selamat pagi | Pagi – 12 tengah hari |\n| **Good afternoon** | Selamat tengah hari / petang | 12 – 6 petang |\n| **Good evening** | Selamat petang / malam | Selepas 6 petang (bila berjumpa) |\n| **Good night** | Selamat malam | Bila **berpisah** / nak tidur |\n| **Goodbye / Bye** | Selamat tinggal | Bila berpisah |\n| **See you!** | Jumpa lagi! | Bila berpisah (santai) |\n\n> ⚠️ **Silap biasa:** *\"Good night\"* BUKAN untuk menegur orang. Ia untuk ucap selamat tinggal waktu malam. Untuk menegur waktu malam, guna *\"Good evening\"*.\n\n## 2. Tanya Khabar\n\n**A:** How are you? *(Apa khabar?)*\n**B:** I'm fine, thank you. And you? *(Saya sihat, terima kasih. Awak pula?)*\n**A:** I'm good, thanks! *(Saya baik, terima kasih!)*\n\nJawapan lain:\n- **I'm great!** — Saya sangat baik!\n- **Not bad.** — Boleh tahan.\n- **I'm tired.** — Saya penat.\n\n## 3. Memperkenalkan Diri\n\nGunakan **templat** ini. Tukar bahagian dalam [kurungan]:\n\n```\nHello! My name is [Aisyah].\nI am [25] years old.\nI am from [Kuala Lumpur, Malaysia].\nI am a [teacher / student / nurse].\nI like [reading / cooking / football].\nNice to meet you!\n```\n\n**Maksud:**\n- My name is... = Nama saya...\n- I am ... years old = Umur saya ... tahun\n- I am from... = Saya berasal dari...\n- I am a... = Saya seorang...\n- I like... = Saya suka...\n- Nice to meet you = Gembira berkenalan dengan awak\n\n## 4. Contoh Perbualan\n\n**Ali:** Hi! What's your name? *(Hai! Siapa nama awak?)*\n**Mei:** Hello! My name is Mei. What's your name?\n**Ali:** I'm Ali. Nice to meet you, Mei.\n**Mei:** Nice to meet you too! *(Gembira berkenalan dengan awak juga!)*\n**Ali:** Where are you from? *(Awak dari mana?)*\n**Mei:** I'm from Penang. And you?\n**Ali:** I'm from Johor.\n\n## 5. Perkataan Sopan (Wajib Tahu!) 🙏\n\n| Bahasa Inggeris | Maksud |\n|-----------------|--------|\n| **Please** | Tolong / Sila |\n| **Thank you / Thanks** | Terima kasih |\n| **You're welcome** | Sama-sama |\n| **Sorry** | Maaf (kalau buat salah) |\n| **Excuse me** | Maaf / Tumpang tanya (untuk dapatkan perhatian) |\n\n## ✏️ Latihan\n\nIsi tempat kosong:\n\n1. Good ________! (waktu pagi)\n2. How ______ you?\n3. My ______ is Siti.\n4. Nice to ______ you.\n5. Tulis perkenalan diri anda sendiri guna templat di atas (5 ayat).\n\n<details>\n<summary>👉 Klik untuk lihat jawapan<\/summary>\n\n1. morning\n2. are\n3. name\n4. meet\n5. (Ikut diri anda) Contoh: *Hello! My name is Siti. I am 20 years old. I am from Kedah. I am a student. Nice to meet you!*\n<\/details>\n\n---\n⬅️ [Pelajaran 1](01-abjad-dan-sebutan.md) | ➡️ [Pelajaran 3 – Nombor, Hari & Bulan](03-nombor-hari-bulan.md)\n", "# Pelajaran 3: Nombor, Hari & Bulan\n\n🎯 **Matlamat:** Boleh sebut nombor, hari, bulan dan masa.\n\n## 1. Nombor 0–20\n\n| | | | |\n|---|---|---|---|\n| 0 zero | 1 one | 2 two | 3 three |\n| 4 four | 5 five | 6 six | 7 seven |\n| 8 eight | 9 nine | 10 ten | 11 eleven |\n| 12 twelve | 13 thirteen | 14 fourteen | 15 fifteen |\n| 16 sixteen | 17 seventeen | 18 eighteen | 19 nineteen |\n| 20 twenty | | | |\n\n> 💡 Nombor **13–19** semua berakhir dengan **-teen**.\n\n## 2. Puluhan\n\n| 10 ten | 20 twenty | 30 thirty | 40 **forty** (bukan \"fourty\"!) |\n|---|---|---|---|\n| 50 fifty | 60 sixty | 70 seventy | 80 eighty |\n| 90 ninety | 100 one hundred | 1,000 one thousand | |\n\n**Cara gabung:** puluhan + sengkang + sa\n- 21 = twenty-one\n- 35 = thirty-five\n- 99 = ninety-nine\n\n> ⚠️ **Hati-hati:** **thirteen (13)** vs **thirty (30)**. Untuk *-teen*, tekan bunyi di hujung: \"thir-**TIIN**\". Untuk *-ty*, tekan di depan: \"**THIR**-ti\".\n\n## 3. Hari Dalam Seminggu (Days)\n\n| Bahasa Inggeris | Maksud |\n|-----------------|--------|\n| Monday | Isnin |\n| Tuesday | Selasa |\n| Wednesday | Rabu (sebut: \"wenz-dei\") |\n| Thursday | Khamis |\n| Friday | Jumaat |\n| Saturday | Sabtu |\n| Sunday | Ahad |\n\n> 💡 Nama hari dan bulan **sentiasa huruf besar** di depan: **M**onday, **J**anuary.\n\n## 4. Bulan (Months)\n\n| | | |\n|---|---|---|\n| January – Januari | February – Februari | March – Mac |\n| April – April | May – Mei | June – Jun |\n| July – Julai | August – Ogos | September – September |\n| October – Oktober | November – November | December – Disember |\n\n## 5. Perkataan Masa\n\n- **today** = hari ini\n- **tomorrow** = esok\n- **yesterday** = semalam\n- **week** = minggu, **month** = bulan, **year** = tahun\n\n## 6. Bertanya Masa ⏰\n\n**A:** What time is it? *(Pukul berapa sekarang?)*\n**B:** It's three o'clock. *(Pukul tiga.)*\n\n| Masa | Cara sebut |\n|------|-----------|\n| 3:00 | three o'clock |\n| 3:15 | three fifteen / quarter past three |\n| 3:30 | three thirty / half past three |\n| 3:45 | three forty-five / quarter to four |\n| pagi | a.m. — contoh: 8 a.m. |\n| petang/malam | p.m. — contoh: 8 p.m. |\n\n## ✏️ Latihan\n\n1. Tulis dalam perkataan: **14, 40, 57, 100**\n2. Hari apa selepas **Tuesday**?\n3. Apa Bahasa Inggeris untuk **\"Ogos\"**?\n4. Sebut masa ini: **7:30**\n5. \"Esok\" dalam Bahasa Inggeris ialah ________.\n\n<details>\n<summary>👉 Klik untuk lihat jawapan<\/summary>\n\n1. fourteen, forty, fifty-seven, one hundred\n2. Wednesday\n3. August\n4. seven thirty / half past seven\n5. tomorrow\n<\/details>\n\n---\n⬅️ [Pelajaran 2](02-salam-dan-perkenalan.md) | ➡️ [Pelajaran 4 – Kata Ganti Nama & \"To Be\"](04-kata-ganti-nama-dan-to-be.md)\n", "# Pelajaran 4: Kata Ganti Nama & \"To Be\" (am / is / are)\n\n🎯 **Matlamat:** Faham perkataan **paling penting** dalam Bahasa Inggeris: *am, is, are*.\n\n## 1. Kata Ganti Nama (Pronouns)\n\n| Bahasa Inggeris | Maksud |\n|-----------------|--------|\n| **I** | Saya (sentiasa huruf besar!) |\n| **You** | Awak / Kamu / Anda |\n| **He** | Dia (lelaki) |\n| **She** | Dia (perempuan) |\n| **It** | Ia (benda / binatang) |\n| **We** | Kami / Kita |\n| **They** | Mereka |\n\n> 💡 Dalam Bahasa Melayu, \"dia\" untuk lelaki dan perempuan. Dalam Bahasa Inggeris, **lelaki = he**, **perempuan = she**.\n\n## 2. \"To Be\" — am / is / are\n\nDalam Bahasa Melayu kita kata *\"Saya guru\"*. Dalam Bahasa Inggeris, **wajib** ada perkataan penghubung: *\"I **am** a teacher.\"*\n\n### 🔑 Formula (hafal ini!)\n\n| Pronoun | To Be | Singkatan | Contoh |\n|---------|-------|-----------|--------|\n| I | **am** | I'm | I am happy. *(Saya gembira.)* |\n| He / She / It | **is** | he's / she's / it's | She is a doctor. *(Dia doktor.)* |\n| You / We / They | **are** | you're / we're / they're | They are students. *(Mereka pelajar.)* |\n\n> 🧠 **Cara ingat:** **I** → **am**. Seorang (he/she/it) → **is**. Ramai atau \"you\" → **are**.\n\n## 3. Bila Guna \"To Be\"?\n\n1. **Nama / pekerjaan:** I am Ahmad. He is a driver.\n2. **Perasaan / keadaan:** We are tired. She is sick.\n3. **Umur:** I am 30 years old.\n4. **Tempat:** They are at home. *(Mereka di rumah.)*\n5. **Sifat:** The car is red. *(Kereta itu merah.)*\n\n## 4. Ayat Negatif — tambah **not**\n\n| Positif | Negatif |\n|---------|---------|\n| I am hungry. | I am **not** hungry. (I'm not) |\n| He is busy. | He is **not** busy. (He **isn't**) |\n| They are here. | They are **not** here. (They **aren't**) |\n\n## 5. Ayat Soalan — terbalikkan susunan\n\n| Penyata | Soalan |\n|---------|--------|\n| You **are** a student. | **Are** you a student? |\n| She **is** at school. | **Is** she at school? |\n\n**Jawapan pendek:**\n- Yes, I am. / No, I'm not.\n- Yes, she is. / No, she isn't.\n\n## 6. a / an — \"seorang / sebuah\"\n\n- **a** sebelum bunyi konsonan: **a** book, **a** car, **a** teacher\n- **an** sebelum bunyi vokal (a, e, i, o, u): **an** apple, **an** egg, **an** umbrella\n\n## ✏️ Latihan\n\nIsi dengan **am / is / are**:\n\n1. I ____ a student.\n2. She ____ my sister.\n3. We ____ friends.\n4. The cat ____ black.\n5. They ____ not at home.\n\nTukar kepada soalan:\n\n6. He is a doctor. → ____________?\n\nPilih **a** atau **an**:\n\n7. ____ orange   8. ____ house\n\n<details>\n<summary>👉 Klik untuk lihat jawapan<\/summary>\n\n1. am\n2. is\n3. are\n4. is\n5. are\n6. Is he a doctor?\n7. an orange\n8. a house\n<\/details>\n\n---\n⬅️ [Pelajaran 3](03-nombor-hari-bulan.md) | ➡️ [Pelajaran 5 – Ayat Mudah (Present Simple)](05-ayat-mudah-present-simple.md)\n", "# Pelajaran 5: Ayat Mudah — Present Simple\n\n🎯 **Matlamat:** Boleh bercakap tentang **rutin harian** dan **perkara yang biasa berlaku**.\n\n## 1. Susunan Ayat Bahasa Inggeris\n\nSama macam Bahasa Melayu! 🎉\n\n```\nSiapa   +   Buat apa   +   Apa / Di mana\n(Subjek)    (Kata kerja)   (Objek)\n\n  I     +     eat      +   rice.\n Saya         makan         nasi.\n```\n\n## 2. Kata Kerja Asas (Verbs)\n\n| Verb | Maksud | Verb | Maksud |\n|------|--------|------|--------|\n| eat | makan | drink | minum |\n| sleep | tidur | wake up | bangun |\n| go | pergi | come | datang |\n| work | bekerja | study | belajar |\n| read | baca | write | tulis |\n| like | suka | want | mahu |\n| have | ada / mempunyai | speak | bercakap |\n| watch | tonton | play | main |\n\n## 3. ⭐ Peraturan Paling Penting: Tambah **-s**\n\nBila subjek ialah **he / she / it** (seorang/satu benda), kata kerja **tambah -s**.\n\n| Subjek | Contoh |\n|--------|--------|\n| I / You / We / They | I **eat** rice. They **play** football. |\n| He / She / It | He **eats** rice. She **plays** football. |\n\n### Ejaan khas:\n- Berakhir **-o, -sh, -ch, -ss, -x** → tambah **-es**: go → go**es**, watch → watch**es**\n- Berakhir konsonan + **y** → tukar ke **-ies**: study → stud**ies**\n- **have** → **has** (khas!): She **has** a cat.\n\n## 4. Ayat Negatif — guna **don't / doesn't**\n\n| Subjek | Negatif | Contoh |\n|--------|---------|--------|\n| I / You / We / They | **don't** + verb | I **don't** like durian. |\n| He / She / It | **doesn't** + verb (tiada -s) | She **doesn't** like durian. |\n\n> ⚠️ Selepas **doesn't**, buang -s: ~~She doesn't likes~~ ❌ → She doesn't **like** ✅\n\n## 5. Ayat Soalan — guna **Do / Does**\n\n| Soalan | Jawapan pendek |\n|--------|----------------|\n| **Do** you like coffee? | Yes, I do. / No, I don't. |\n| **Does** he work here? | Yes, he does. / No, he doesn't. |\n\n## 6. Perkataan Kekerapan\n\n| | Maksud | |\n|---|---|---|\n| **always** | selalu (100%) | I always drink water. |\n| **usually** | biasanya | I usually wake up at 6. |\n| **sometimes** | kadang-kadang | I sometimes cook. |\n| **never** | tidak pernah (0%) | I never smoke. |\n| **every day** | setiap hari | I study English every day. |\n\n## 7. Contoh: Rutin Harian Saya\n\n> I wake up at 6 a.m. every day. I take a shower and I eat breakfast. I usually drink tea. I go to work at 8. My sister doesn't work. She studies at university. In the evening, I watch TV. I sleep at 11 p.m.\n\n## ✏️ Latihan\n\nBetulkan kata kerja dalam kurungan:\n\n1. She ______ (eat) bread every morning.\n2. We ______ (go) to school by bus.\n3. My father ______ (watch) the news.\n4. He ______ (not / like) fish.\n5. ______ you speak English?\n6. ______ she have a car?\n\n7. Tulis 3 ayat tentang rutin harian **anda**.\n\n<details>\n<summary>👉 Klik untuk lihat jawapan<\/summary>\n\n1. eats\n2. go\n3. watches\n4. doesn't like\n5. Do\n6. Does\n7. (Ikut diri anda) Contoh: *I wake up at 7. I drink coffee. I go to work by car.*\n<\/details>\n\n---\n⬅️ [Pelajaran 4](04-kata-ganti-nama-dan-to-be.md) | ➡️ [Pelajaran 6 – Bertanya Soalan](06-bertanya-soalan.md)\n", "# Pelajaran 6: Bertanya Soalan (WH-Questions)\n\n🎯 **Matlamat:** Boleh bertanya soalan untuk dapatkan maklumat.\n\n## 1. Perkataan Soalan\n\n| Bahasa Inggeris | Maksud | Contoh |\n|-----------------|--------|--------|\n| **What** | Apa | What is your name? *(Siapa nama awak?)* |\n| **Where** | Di mana | Where do you live? *(Awak tinggal di mana?)* |\n| **When** | Bila | When is your birthday? *(Bila hari jadi awak?)* |\n| **Who** | Siapa | Who is she? *(Siapa dia?)* |\n| **Why** | Kenapa | Why are you sad? *(Kenapa awak sedih?)* |\n| **How** | Bagaimana | How are you? *(Apa khabar?)* |\n| **Which** | Yang mana | Which one do you want? *(Awak nak yang mana?)* |\n\n> 💡 Perhatikan: *\"What is your name?\"* diterjemah sebagai **\"Siapa** nama awak?\", bukan \"Apa nama awak\". Bahasa tak selalu sama perkataan demi perkataan!\n\n## 2. \"How\" + Perkataan Lain\n\n| Soalan | Maksud | Contoh jawapan |\n|--------|--------|----------------|\n| **How much** is this? | Berapa harga ini? | It's 10 ringgit. |\n| **How many** children do you have? | Berapa ramai anak awak? | I have two. |\n| **How old** are you? | Berapa umur awak? | I'm 25. |\n| **How long** is the trip? | Berapa lama perjalanan? | Two hours. |\n\n> 💡 **How much** = untuk harga / benda tak boleh dikira (air, duit).\n> **How many** = untuk benda boleh dikira (orang, buku, kereta).\n\n## 3. Formula Bina Soalan\n\n### Dengan **to be** (am/is/are):\n```\nWH-word + am/is/are + subjek ?\n Where  +    is     + the toilet?\n```\n\n### Dengan kata kerja lain:\n```\nWH-word + do/does + subjek + verb ?\n What   +   do    +  you   + want?\n Where  +  does   +  he    + work?\n```\n\n## 4. Soalan Berguna Setiap Hari 🌟\n\n- **Where is the toilet?** — Tandas di mana?\n- **How much is this?** — Berapa harga ini?\n- **What does this mean?** — Apa maksud ini?\n- **Can you help me?** — Boleh tolong saya?\n- **Can you speak slowly, please?** — Boleh cakap perlahan sikit?\n- **Can you repeat that, please?** — Boleh ulang sekali lagi?\n- **How do you say \"kucing\" in English?** — Apa Bahasa Inggeris untuk \"kucing\"?\n\n> ⭐ Tiga soalan terakhir sangat penting untuk pelajar! Jangan malu guna.\n\n## ✏️ Latihan\n\nPilih perkataan soalan yang betul:\n\n1. ______ is your birthday? — In May.\n2. ______ do you live? — In Ipoh.\n3. ______ is that man? — He is my uncle.\n4. ______ are you late? — Because of the traffic.\n5. ______ much is the shirt? — 30 ringgit.\n6. ______ many brothers do you have? — Three.\n\nSusun perkataan menjadi soalan:\n\n7. does / work / where / she → ______________?\n\n<details>\n<summary>👉 Klik untuk lihat jawapan<\/summary>\n\n1. When\n2. Where\n3. Who\n4. Why\n5. How\n6. How\n7. Where does she work?\n<\/details>\n\n---\n⬅️ [Pelajaran 5](05-ayat-mudah-present-simple.md) | ➡️ [Pelajaran 7 – Kosa Kata Asas](07-kosa-kata-asas.md)\n", "# Pelajaran 7: Kosa Kata Asas (Basic Vocabulary)\n\n🎯 **Matlamat:** Tahu perkataan yang paling kerap digunakan setiap hari.\n\n> 💡 **Tips hafal:** Belajar **5 perkataan sehari**. Tulis di kertas kecil dan tampal di tempat yang selalu nampak (peti sejuk, cermin).\n\n## 👨‍👩‍👧‍👦 Keluarga (Family)\n\n| | | | |\n|---|---|---|---|\n| father / dad – ayah | mother / mum – ibu | brother – abang/adik lelaki | sister – kakak/adik perempuan |\n| son – anak lelaki | daughter – anak perempuan | husband – suami | wife – isteri |\n| grandfather – datuk | grandmother – nenek | uncle – pak cik | aunt – mak cik |\n| cousin – sepupu | baby – bayi | parents – ibu bapa | children – anak-anak |\n\n> 💡 *Older brother* = abang, *younger brother* = adik lelaki.\n\n## 🎨 Warna (Colours)\n\nred – merah · blue – biru · green – hijau · yellow – kuning · black – hitam · white – putih · orange – jingga/oren · pink – merah jambu · purple – ungu · brown – coklat · grey – kelabu\n\n> ⚠️ **Susunan berbeza!** Bahasa Melayu: kereta **merah**. Bahasa Inggeris: a **red** car. Sifat (adjektif) **di depan** benda.\n\n## 🍚 Makanan & Minuman (Food & Drinks)\n\n| | | |\n|---|---|---|\n| rice – nasi | bread – roti | egg – telur |\n| chicken – ayam | fish – ikan | beef – daging lembu |\n| vegetables – sayur | fruit – buah | noodles – mi |\n| water – air | tea – teh | coffee – kopi |\n| milk – susu | sugar – gula | salt – garam |\n\n## 🏠 Tempat (Places)\n\nhouse / home – rumah · school – sekolah · office – pejabat · hospital – hospital · shop – kedai · market – pasar · bank – bank · mosque – masjid · restaurant – restoran · park – taman · airport – lapangan terbang · bus stop – perhentian bas\n\n## 😊 Perasaan (Feelings)\n\nhappy – gembira · sad – sedih · angry – marah · tired – penat · hungry – lapar · thirsty – dahaga · scared – takut · bored – bosan · sick – sakit · excited – teruja\n\nContoh: *I am **hungry**. Let's eat!* (Saya lapar. Jom makan!)\n\n## ↔️ Perkataan Berlawanan (Opposites)\n\n| | | |\n|---|---|---|\n| big ↔ small (besar ↔ kecil) | hot ↔ cold (panas ↔ sejuk) | fast ↔ slow (laju ↔ perlahan) |\n| new ↔ old (baru ↔ lama) | good ↔ bad (baik ↔ buruk) | easy ↔ difficult (senang ↔ susah) |\n| open ↔ close (buka ↔ tutup) | cheap ↔ expensive (murah ↔ mahal) | happy ↔ sad (gembira ↔ sedih) |\n\n## ✏️ Latihan\n\nTerjemah ke Bahasa Inggeris:\n\n1. kereta biru → a ______ car\n2. ibu bapa → ______\n3. Saya dahaga. → I am ______.\n4. Lawan bagi **cheap** → ______\n5. pasar → ______\n6. Terjemah: *\"My grandmother drinks hot tea.\"*\n\n<details>\n<summary>👉 Klik untuk lihat jawapan<\/summary>\n\n1. blue\n2. parents\n3. thirsty\n4. expensive\n5. market\n6. Nenek saya minum teh panas.\n<\/details>\n\n---\n⬅️ [Pelajaran 6](06-bertanya-soalan.md) | ➡️ [Pelajaran 8 – Perbualan Harian](08-perbualan-harian.md)\n", "# Pelajaran 8: Perbualan Harian (Daily Conversations)\n\n🎯 **Matlamat:** Guna semua yang dah dipelajari dalam situasi sebenar.\n\n> 💡 **Cara berlatih:** Baca dialog dengan kuat. Lebih baik lagi — berlatih dengan kawan, seorang jadi A, seorang jadi B. Kemudian tukar peranan.\n\n## 🛒 Situasi 1: Di Kedai\n\n**Pekerja:** Hello! Can I help you? *(Boleh saya bantu?)*\n**Anda:** Yes, please. I'm looking for a T-shirt. *(Ya. Saya cari baju-T.)*\n**Pekerja:** What size? *(Saiz apa?)*\n**Anda:** Medium, please.\n**Pekerja:** Here you are. *(Ini dia.)*\n**Anda:** How much is it? *(Berapa harganya?)*\n**Pekerja:** It's 25 ringgit.\n**Anda:** OK, I'll take it. *(Baik, saya ambil.)*\n**Pekerja:** Thank you!\n\n**Frasa berguna:**\n- Can I try it on? — Boleh saya cuba pakai?\n- Do you have a bigger size? — Ada saiz lebih besar?\n- It's too expensive. — Mahal sangat.\n- Can I pay by card? — Boleh bayar guna kad?\n\n## 🍽️ Situasi 2: Di Restoran\n\n**Pelayan:** Good evening! Table for how many? *(Meja untuk berapa orang?)*\n**Anda:** For two, please.\n**Pelayan:** What would you like to order? *(Nak pesan apa?)*\n**Anda:** I would like fried rice and an iced tea, please. *(Saya nak nasi goreng dan teh ais.)*\n**Pelayan:** Anything else? *(Ada lagi?)*\n**Anda:** No, thank you.\n...\n**Anda:** Excuse me, can I have the bill, please? *(Maaf, boleh minta bil?)*\n\n**Frasa berguna:**\n- I would like... / I'd like... — Saya mahu... (cara sopan)\n- Not spicy, please. — Tak nak pedas.\n- It's delicious! — Sedap!\n\n## 🗺️ Situasi 3: Tanya Jalan\n\n**Anda:** Excuse me. Where is the train station? *(Tumpang tanya. Stesen kereta api di mana?)*\n**Orang:** Go straight and turn left at the traffic lights. *(Jalan terus dan belok kiri di lampu isyarat.)*\n**Anda:** Is it far? *(Jauh ke?)*\n**Orang:** No, it's about five minutes' walk. *(Tak, lebih kurang lima minit berjalan kaki.)*\n**Anda:** Thank you very much!\n**Orang:** You're welcome.\n\n**Arah:**\n| | |\n|---|---|\n| go straight – jalan terus | turn left – belok kiri |\n| turn right – belok kanan | next to – sebelah |\n| opposite – bertentangan | behind – belakang |\n| in front of – depan | near – dekat |\n\n## 📞 Situasi 4: Di Telefon\n\n**A:** Hello?\n**B:** Hello, can I speak to Encik Rahman, please? *(Boleh saya bercakap dengan Encik Rahman?)*\n**A:** Sorry, he's not here right now. Can I take a message? *(Maaf, dia tiada sekarang. Nak tinggal pesanan?)*\n**B:** Yes, please tell him Aminah called. *(Ya, tolong beritahu Aminah telefon.)*\n**A:** Sure. *(Baik.)*\n\n## 🆘 Bila Anda Tak Faham\n\nIni **penyelamat** anda! Jangan pura-pura faham — tanya saja:\n\n- **Sorry, I don't understand.** — Maaf, saya tak faham.\n- **Can you speak slowly, please?** — Boleh cakap perlahan sikit?\n- **Can you say that again?** — Boleh ulang?\n- **My English is not very good.** — Bahasa Inggeris saya tak berapa bagus.\n\n## ✏️ Latihan\n\nApa anda akan cakap dalam situasi ini?\n\n1. Anda nak tahu harga sebuah beg.\n2. Anda nak minta bil di restoran.\n3. Anda tak faham apa orang itu cakap.\n4. Anda nak pesan kopi dengan sopan.\n5. Orang beri arah: *\"Turn right.\"* Apa maksudnya?\n\n<details>\n<summary>👉 Klik untuk lihat jawapan<\/summary>\n\n1. How much is this bag?\n2. Excuse me, can I have the bill, please?\n3. Sorry, I don't understand. Can you speak slowly, please?\n4. I would like a coffee, please.\n5. Belok kanan.\n<\/details>\n\n---\n⬅️ [Pelajaran 7](07-kosa-kata-asas.md) | ➡️ [Ujian Akhir](09-ujian-akhir.md)\n"];

const store = {
  get(k, d) { try { const v = localStorage.getItem("bi:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("bi:" + k, JSON.stringify(v)); } catch (e) {} }
};
let done = new Set(store.get("done", []));
function saveDone() { store.set("done", [...done]); updateMeter(); }
function updateMeter() {

/* ---------- speech ---------- */
const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch (e) {} }
if (canSpeak) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
let playingBtn = null;
function speak(text, btn) {
  if (!canSpeak || !text) return;
  try {
    speechSynthesis.cancel();
    if (playingBtn) playingBtn.classList.remove("playing");
    const u = new SpeechSynthesisUtterance(text);
    const v = voices.find(v => /^en[-_]GB/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    u.lang = v ? v.lang : "en-GB";
    u.rate = 0.85;
    if (btn) { btn.classList.add("playing"); playingBtn = btn; }
    u.onend = u.onerror = () => { if (btn) btn.classList.remove("playing"); };
    speechSynthesis.speak(u);
  } catch (e) {}
}
function spkBtn(text, small) {
  if (!canSpeak) return null;
  const b = document.createElement("button");
  b.type = "button";
  b.className = "spk" + (small ? " sm" : "");
  b.innerHTML = ICON_SPK;
  b.setAttribute("aria-label", "Dengar: " + text);
  b.addEventListener("click", e => { e.stopPropagation(); speak(text, b); });
  return b;
}

/* ---------- markdown → lesson ---------- */
function prepMd(md) {
  let lines = md.split("\n");
  lines.shift(); // drop H1, rendered separately
  let body = lines.join("\n");
  const cut = body.lastIndexOf("\n---\n");
  if (cut > -1) body = body.slice(0, cut);
  return body;
}
function renderMd(md) {
  if (window.marked) return marked.parse(md, { gfm: true, breaks: true });
  const pre = document.createElement("pre"); pre.textContent = md; return pre.outerHTML;
}
const ENGLISHISH = /^[A-Za-z0-9 ,.'’?!\-"“”/()]+$/;

function enhance(root, n) {
  // goal line
  const first = root.querySelector("p");
  if (first && first.textContent.trim().startsWith("🎯")) first.className = "goal";

  // tables in scroll wrappers
  root.querySelectorAll("table").forEach(t => {
    const w = document.createElement("div"); w.className = "tbl";
    t.replaceWith(w); w.appendChild(t);
    if ([...t.querySelectorAll("th")].every(th => !th.textContent.trim())) t.querySelector("thead")?.remove();
  });

  // dialogues: paragraphs where every line starts with **Name:**
  root.querySelectorAll("p").forEach(p => {
    const parts = p.innerHTML.split(/<br\s*\/?>\s*/i).filter(x => x.trim());
    const isLabel = h => /^\s*<strong>[^<]{1,24}:<\/strong>/.test(h);
    const isGap = h => /^\s*(\.\.\.|…)\s*$/.test(h);
    if (parts.length < 2 || !parts.every(h => isLabel(h) || isGap(h))) return;
    const box = document.createElement("div"); box.className = "dialog";
    parts.forEach(h => {
      const line = document.createElement("div");
      if (isGap(h)) { line.className = "dl gap"; line.textContent = "…"; box.appendChild(line); return; }
      line.className = "dl";
      const body = document.createElement("div"); body.className = "body"; body.innerHTML = h;
      const who = body.querySelector("strong"); who.className = "who";
      who.textContent = who.textContent.replace(/:\s*$/, "");
      const clone = body.cloneNode(true);
      clone.querySelector(".who").remove();
      clone.querySelectorAll("em").forEach(e => { if (/^\(.*\)$/.test(e.textContent.trim())) e.remove(); });
      const say = clone.textContent.trim();
      const b = spkBtn(say);
      if (b) line.appendChild(b);
      line.appendChild(body);
      box.appendChild(line);
    });
    p.replaceWith(box);
  });

  // list items like "English — Malay" or "word → bunyi"
  root.querySelectorAll("li").forEach(li => {
    if (li.closest("details")) return;
    const txt = li.textContent.trim();
    const m = txt.match(/^(.+?)\s+(—|–|→|=)\s+/);
    if (!m) return;
    const en = m[1].replace(/\*/g, "").trim();
    if (!ENGLISHISH.test(en) || /^\d+$/.test(en)) return;
    const b = spkBtn(en, true);
    if (b) li.appendChild(b);
  });

  // table cells: bold English phrases become tappable
  root.querySelectorAll("td").forEach(td => {
    const s = td.querySelector("strong");
    const plain = td.textContent.trim();
    if (n === 1 && /^[A-Z] [a-z]$/.test(plain)) {
      td.classList.add("tap", "letter"); td.tabIndex = 0;
      td.title = "Tekan untuk dengar";
      const go = () => speak(plain[0]);
      td.addEventListener("click", go);
      td.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      return;
    }
    if (s && td.firstElementChild === s && ENGLISHISH.test(s.textContent.trim()) && td.cellIndex === 0) {
      const b = spkBtn(s.textContent.replace(/\s*\/\s*/g, ", ").trim(), true);
      if (b) td.appendChild(b);
    }
  });

  // details label
  root.querySelectorAll("summary").forEach(s => { s.textContent = "Tunjuk jawapan"; });
}

    </header>
    ${canSpeak ? `<div class="hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg><span>Tekan butang bunyi untuk dengar sebutan. Anda juga boleh pilih (highlight) mana-mana perkataan Inggeris, kemudian tekan “Dengar”.</span></div>` : ""}
    <article class="lesson" id="lesson">${renderMd(prepMd(L))}</article>
    <footer class="lesson-foot">
      <button type="button" class="btn ${isDone ? "done" : ""}" id="doneBtn">${isDone ? "✓ Selesai — tekan untuk batal" : "Tandakan pelajaran ini selesai"}</button>
      <nav class="pager">
        ${n > 1 ? `<a href="#pelajaran-${n - 1}"><span>← Sebelum</span>${META[n - 2].t}</a>` : ""}
        ${n < 8 ? `<a class="next" href="#pelajaran-${n + 1}"><span>Seterusnya →</span>${META[n].t}</a>` : `<a class="next" href="#ujian"><span>Seterusnya →</span>Ujian Akhir</a>`}
      </nav>
    </footer>
  `;
  enhance(document.getElementById("lesson"), n);
  document.getElementById("doneBtn").addEventListener("click", () => {
    if (done.has(n)) done.delete(n); else done.add(n);
    saveDone();
    if (done.has(n) && n < 8) { location.hash = "pelajaran-" + (n + 1); } else { viewLesson(n); }
  });
}

  B: [
    { q: "Selamat pagi.", ok: ["good morning"], show: "Good morning." },
    { q: "Nama saya Faiz.", ok: ["my name is faiz", "i am faiz", "im faiz"], show: "My name is Faiz." },
    { q: "Saya lapar.", ok: ["i am hungry", "im hungry"], show: "I am hungry." },
    { q: "Hari ini hari Jumaat.", ok: ["today is friday", "it is friday today", "its friday today"], show: "Today is Friday." },
    { q: "Ibu saya suka minum kopi.", ok: ["my mother likes to drink coffee", "my mother likes drinking coffee", "my mum likes to drink coffee", "my mum likes drinking coffee", "my mom likes to drink coffee", "my mom likes drinking coffee", "my mother likes coffee"], show: "My mother likes to drink coffee. / My mother likes drinking coffee." }
  ],
  C: [
    { q: "i am from Malaysia.", ok: ["i am from malaysia", "im from malaysia"], capI: true, show: "I am from Malaysia. (I sentiasa huruf besar)" },
    { q: "He have two cats.", ok: ["he has two cats"], show: "He has two cats." },
    { q: "She don't work on Sunday.", ok: ["she doesnt work on sunday", "she does not work on sunday", "she doesnt work on sundays", "she does not work on sundays"], show: "She doesn't work on Sunday." },
    { q: "I am go to school.", ok: ["i go to school", "i am going to school", "im going to school"], show: "I go to school. (atau: I am going to school.)" },
    { q: "a car red", ok: ["a red car"], show: "a red car" }
  ]
};
const BANDS = [
  { min: 18, t: "Excellent! Cemerlang!", d: "Anda bersedia untuk tahap seterusnya." },
  { min: 14, t: "Good job! Bagus!", d: "Ulang pelajaran yang anda salah." },
  { min: 10, t: "Not bad! Boleh tahan.", d: "Ulang Pelajaran 4 & 5." },
  { min: 0, t: "Keep trying! Jangan putus asa.", d: "Ulang dari Pelajaran 1, perlahan-lahan." }
];
function norm(s) {
  return s.toLowerCase().replace(/[’‘`]/g, "'").replace(/'/g, "").replace(/[.,!?;:"“”()]/g, " ").replace(/\s+/g, " ").trim();
}
function checkTyped(item, val) {
  const v = val.trim();
  if (!v) return false;
  if (item.capI && !/^\s*I\b/.test(v)) return false;
  return item.ok.includes(norm(v));
}

let testState = null;

function viewTest() {
  const draft = store.get("draft", {});
  app.innerHTML = `
    <div class="crumbs"><a href="#">← Semua pelajaran</a><span>20 soalan</span></div>
    <header class="lesson-head">
      <div class="eyebrow">Ujian Akhir</div>
      <h1>Tahniah kerana sampai ke sini!</h1>
      <p class="sub">Cuba jawab tanpa melihat nota. Setiap soalan 1 markah. Tekan “Semak jawapan” di bawah bila siap.</p>
    </header>
    <form id="testForm" novalidate>
      <h2 class="part-h">Bahagian A<small>Pilih jawapan yang betul</small></h2>
      <div class="qs">
        ${TEST.A.map((x, i) => `
          <div class="q" id="qA${i}">
            <div class="qt"><span class="qn">${i + 1}</span><div>${x.q}</div></div>
            <div class="opts" role="radiogroup" aria-label="Soalan ${i + 1}">
              ${x.o.map((o, j) => `<label class="opt"><input type="radio" name="A${i}" id="A${i}_${j}" value="${j}" ${draft["A" + i] == j ? "checked" : ""}><span>(${"abc"[j]}) ${o}</span></label>`).join("")}
            </div>
            <div class="fb" hidden></div>
          </div>`).join("")}
      </div>

      <h2 class="part-h">Bahagian B<small>Terjemah ke Bahasa Inggeris</small></h2>
      <div class="qs">
        ${TEST.B.map((x, i) => `
          <div class="q" id="qB${i}">
            <div class="qt"><span class="qn">${i + 11}</span><div>${x.q}</div></div>
            <div class="fieldwrap"><input type="text" id="B${i}" name="B${i}" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Tulis dalam Bahasa Inggeris" value="${(draft["B" + i] || "").replace(/"/g, "&quot;")}"></div>
            <div class="fb" hidden></div>
          </div>`).join("")}
      </div>

      <h2 class="part-h">Bahagian C<small>Betulkan kesalahan. Tulis semula ayat yang betul.</small></h2>
      <div class="qs">
        ${TEST.C.map((x, i) => `
          <div class="q" id="qC${i}">
            <div class="qt"><span class="qn">${i + 16}</span><div class="wrongtxt">${x.q}</div></div>
            <div class="fieldwrap"><input type="text" id="C${i}" name="C${i}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Ayat yang betul" value="${(draft["C" + i] || "").replace(/"/g, "&quot;")}"></div>
            <div class="fb" hidden></div>
          </div>`).join("")}
      </div>

      <div class="cta-row" style="margin-top:24px">
        <button type="submit" class="btn">Semak jawapan</button>
        <button type="button" class="btn ghost" id="resetBtn">Kosongkan</button>
      </div>
      <div id="result"></div>
    </form>
  `;
  const form = document.getElementById("testForm");
  form.addEventListener("input", () => {
    const d = {};
    TEST.A.forEach((_, i) => { const c = form.querySelector(`input[name="A${i}"]:checked`); if (c) d["A" + i] = +c.value; });
    TEST.B.forEach((_, i) => d["B" + i] = form["B" + i].value);
    TEST.C.forEach((_, i) => d["C" + i] = form["C" + i].value);
    store.set("draft", d);
  });
  form.addEventListener("submit", e => { e.preventDefault(); gradeTest(form); });
  document.getElementById("resetBtn").addEventListener("click", () => { store.set("draft", {}); viewTest(); window.scrollTo(0, 0); });
}

function gradeTest(form) {
  testState = { marks: {} };
  TEST.A.forEach((x, i) => {
    const c = form.querySelector(`input[name="A${i}"]:checked`);
    const ok = !!c && +c.value === x.a;
    testState.marks["A" + i] = ok;
    showFb("A" + i, ok, ok ? "" : `Jawapan: (${"abc"[x.a]}) ${x.o[x.a]}`, false);
  });
  ["B", "C"].forEach(p => TEST[p].forEach((x, i) => {
    const ok = checkTyped(x, form[p + i].value);
    testState.marks[p + i] = ok;
    showFb(p + i, ok, ok ? "" : `Jawapan contoh: ${x.show}`, !ok && form[p + i].value.trim() !== "");
  }));
  updateScore(true);
}

function showFb(key, ok, msg, canOverride) {
  const q = document.getElementById("q" + key);
  q.classList.toggle("right", ok); q.classList.toggle("wrong", !ok);
  const fb = q.querySelector(".fb");
  fb.hidden = false;
  fb.innerHTML = `<span class="tag">${ok ? "✓ Betul" : "✗ Salah"}</span>${msg ? `<span>${msg}</span>` : ""}`;
  if (canOverride) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = "Jawapan saya pun betul";
    b.addEventListener("click", () => { testState.marks[key] = true; showFb(key, true, "Dikira betul", false); updateScore(false); });
    fb.appendChild(b);
  }
}

function updateScore(scroll) {
  const score = Object.values(testState.marks).filter(Boolean).length;
  const band = BANDS.find(b => score >= b.min);
  const best = Math.max(score, store.get("best", 0) || 0);
  store.set("best", best);
  const r = document.getElementById("result");
  r.innerHTML = `
    <div class="result" role="status">
      <div class="eyebrow">Markah anda</div>
      <div class="score">${score}<small>/20</small></div>
      <div class="band">${band.t}</div>
      <p>${band.d}</p>
      <div class="next-topics">
        <strong>Apa seterusnya?</strong>
        <span>• <b>Past Simple</b>: bercakap tentang semalam (<em>I went, I ate</em>)</span>
        <span>• <b>Future</b>: bercakap tentang esok (<em>I will go, I am going to eat</em>)</span>
        <span>• <b>Present Continuous</b>: apa yang sedang berlaku (<em>I am eating now</em>)</span>
      </div>
      <p style="margin-top:8px"><strong>You can do it!</strong> 💪</p>
    </div>`;
  if (scroll) r.scrollIntoView({ behavior: "smooth", block: "center" });
}

/* ---------- router ---------- */
function route() {
  const h = location.hash.replace(/^#/, "");
  const m = h.match(/^pelajaran-([1-8])$/);
  if (canSpeak) try { speechSynthesis.cancel(); } catch (e) {}
  hideSel();
  if (m) viewLesson(+m[1]);
  else if (h === "ujian") viewTest();
  else viewHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- select-to-speak ---------- */
const selbar = document.getElementById("selbar"), selTxt = document.getElementById("selTxt");
let selText = "";
function hideSel() { selbar.hidden = true; selText = ""; }
function onSel() {
  if (!canSpeak) return;
  let s = "";
  try {
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed && sel.anchorNode && app.contains(sel.anchorNode)) s = sel.toString().trim();
  } catch (e) {}
  if (s && s.length <= 300) { selText = s; selTxt.textContent = "“" + s + "”"; selbar.hidden = false; }
  else hideSel();
}
let selTimer;
document.addEventListener("selectionchange", () => { clearTimeout(selTimer); selTimer = setTimeout(onSel, 250); });
document.getElementById("selBtn").addEventListener("mousedown", e => e.preventDefault());
document.getElementById("selBtn").addEventListener("click", () => speak(selText));

updateMeter();
route();
</script>
